[tool.pytest.ini_options]
# devenv's scripts are standalone container entrypoints rather than an
# importable package, so tests import them by name from their own directory
# (pytest prepends each test file's directory to sys.path). "importmode=prepend"
# is the default that makes that work; stated here so it isn't changed by
# accident.
testpaths = ["velocity", "devenv", "user-analysis"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Notebooks are presentation surfaces, not library code: re-importing a symbol
# in a later cell and keeping an import around for exploration are normal there
# but read as errors (F811/F401) to the linter.
extend-exclude = ["velocity/notebooks"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["velocity", "devenv", "user-analysis"]
# dev-auth adds firebase/ to sys.path at runtime (the directory is mounted into
# its container), so tell the checker where those modules come from instead of
# silencing the import. dev-auth itself is listed for a different reason: its
# test imports the neighbouring `app` module the way pytest resolves it, and
# extraPaths are searched before site-packages — so `import app` keeps meaning
# dev-auth's app.py even when the shell has a sibling repo's virtualenv active
# (the api installs itself editable under exactly that name).
extraPaths = ["devenv/firebase", "devenv/dev-auth"]
# Same exclusion as ruff: notebook cells re-import and shadow freely.
exclude = ["velocity/notebooks", "**/__pycache__"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
